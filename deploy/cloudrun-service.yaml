apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mandate-mesh
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "4"
    spec:
      serviceAccountName: AUTHORIZED_IAM_SERVICE_ACCOUNT
      containers:
        - image: IMAGE_REQUIRES_AUTHORIZED_PUBLISH
          ports:
            - containerPort: 8080
          env:
            - name: MM_BIND
              value: 0.0.0.0:8080
            - name: MM_DATA
              value: /tmp/mandates.rvf
            - name: MM_TOKEN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: mandate-mesh-token
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
